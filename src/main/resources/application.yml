server:
  port: 8080

spring:
  application:
    name: tx-sentry

  datasource:
    citus:
      jdbc-url: jdbc:postgresql://citus-coordinator:5432/tx_sentry
      username: postgres
      password: your_password
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 60
        minimum-idle: 10
        connection-timeout: 30000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.web3.txsentry: debug

web3:
  rpc-url: https://mainnet.infura.io/v3/YOUR_PROJECT_ID
  private-key: ${WALLET_PRIVATE_KEY} # 平台热钱包私钥
  chain-id: 1 # 以太坊主网为 1，Goerli 为 5